# Network share for PrintDrop's drop folders. __SHARE__ is replaced at start.
[global]
   server string = PrintDrop
   server role = standalone server
   map to guest = Bad User
   # Guests become "nobody", then "force user" below makes every write the
   # printdrop user. (Making printdrop itself the guest account breaks writes:
   # Samba then maps its files to the guest SID and refuses access.)
   guest account = nobody
   server min protocol = SMB2_10
   disable netbios = yes
   smb ports = 445
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   logging = file
   log file = /var/log/samba/smbd.log
   max log size = 1000
   # Play nicely with Macs (no ._ clutter, Finder copies work)
   vfs objects = fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

[__SHARE__]
   comment = Drop a file in a folder to print it
   path = /data/hotfolders
   browseable = yes
   read only = no
   guest ok = yes
   force user = printdrop
   force group = printdrop
   create mask = 0664
   directory mask = 0775
   veto files = /.DS_Store/Thumbs.db/desktop.ini/
   delete veto files = yes
